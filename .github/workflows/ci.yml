name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Mergeability check (mise run verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config

      - uses: jdx/mise-action@v3

      # mise-action's cache restores mise's install records but not the rustup
      # toolchain home, so a cache hit can leave rustfmt/clippy missing from the
      # toolchain (jdx/mise-action#382). Ensure the components exist — this is
      # idempotent and pins nothing (RUSTUP_TOOLCHAIN comes from mise-action).
      - name: Ensure rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build frontend assets (prerequisite for Rust codegen, not a gate step)
        run: pnpm exec vite build

      - run: mise run verify

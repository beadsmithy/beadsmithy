# Reference-only upstream source checkouts live under docs/research/infra/.
# They are pinned snapshots, not our code, so every pre-commit job excludes
# that path to avoid reformatting/scanning verbatim upstream trees.
#
# Every job routes through scripts/mise-exec.sh and the hook adapter tasks in
# mise.toml (hook:*-staged), so the pinned toolchain and the canonical quality
# command definitions stay in one place. Do not add raw ultracite,
# react-doctor, or cargo invocations here.
pre-commit:
  jobs:
    # Advisory only: capture output, print a hint on findings, never block the
    # commit — even if mise itself fails. No {staged_files}: react-doctor
    # --staged reads the git index itself.
    - run: react_doctor_output=$(mktemp "${TMPDIR:-/tmp}/react-doctor-hook.XXXXXX"); if ./scripts/mise-exec.sh run hook:react-doctor-staged > "$react_doctor_output" 2>&1; then rm -f "$react_doctor_output"; else rm -f "$react_doctor_output"; printf "%s\n" "React Doctor found staged regressions." "Run mise run hook:react-doctor-staged to inspect." "Want them fixed? Ask your agent to run that command and resolve the findings." >&2; fi
      exclude: "docs/research/infra/**"
    - run: ./scripts/mise-exec.sh run hook:ultracite-staged -- {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      exclude:
        - "docs/research/infra/**"
        - ".agents/skills/**"
      stage_fixed: true
    - run: ./scripts/mise-exec.sh run hook:rust-fmt-staged -- {staged_files}
      glob: "**/*.rs"
      exclude: "docs/research/infra/**"
      stage_fixed: true
